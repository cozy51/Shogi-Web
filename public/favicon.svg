<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#2a1f14" />
      <stop offset="55%" stop-color="#181109" />
      <stop offset="100%" stop-color="#0d0906" />
    </radialGradient>

    <linearGradient id="tsugeWood" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fff9ed" />
      <stop offset="25%" stop-color="#f7e5be" />
      <stop offset="60%" stop-color="#edd4a4" />
      <stop offset="90%" stop-color="#dfbe88" />
      <stop offset="100%" stop-color="#d2ad74" />
    </linearGradient>

    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fae5b6" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#8a5c22" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="urushiInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2620" />
      <stop offset="100%" stop-color="#0c0a08" />
    </linearGradient>
  </defs>

  <!-- 背景: 濃墨の艶 -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#bgGlow)" />
  <rect x="2.5" y="2.5" width="95" height="95" rx="21.5" fill="none" stroke="#d97706" stroke-opacity="0.35" stroke-width="1" />

  <!-- 駒: 面取り木地 -->
  <polygon points="50,12 80,27 85,88 15,88 20,27" fill="url(#bevelLight)" stroke="#83571d" stroke-width="1.4" stroke-linejoin="round" />

  <!-- 駒: 黄楊の木肌 -->
  <polygon points="50,15 77,29 81,84 19,84 23,29" fill="url(#tsugeWood)" />

  <!-- 上部・左の光沢ハイライト -->
  <polyline points="23,29 50,15 77,29" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.2" stroke-linecap="round" />

  <!-- 「王」漆文字 -->
  <text x="50" y="60" text-anchor="middle" dominant-baseline="central" fill="url(#urushiInk)" font-family="'Yuji Boku','Klee One','Noto Serif JP','Yu Mincho',serif" font-weight="900" font-size="46" style="filter:drop-shadow(0.6px 1px 0.6px rgba(0,0,0,0.5))">王</text>

  <!-- 落款印（朱） -->
  <circle cx="76" cy="76" r="9" fill="#b91c1c" />
  <circle cx="76" cy="76" r="9" fill="none" stroke="#7f1d1d" stroke-width="1" />
  <text x="76" y="77" text-anchor="middle" dominant-baseline="central" fill="#fef3c7" font-family="'Yuji Boku','Noto Serif JP',serif" font-weight="900" font-size="10">棋</text>
</svg>
